<title>宿舍减脂 · 记录工具</title>
<!--
  设计系统：宿舍减脂工具 v2（iOS HIG 视觉语言，见《iOS减脂工作台-界面设计说明》）
  系统蓝 #007AFF + 分层灰 #F2F2F7；单文件、零外部依赖、断网可用、无任何网络请求
-->
<style>
/* ============================================================
   1. 设计令牌
   ============================================================ */
:root{
  /* —— 品牌绿（墨绿）：色相保留品类识别，明度下沉 + 降饱和 = 高级感来源 —— */
  --brand-900:#12211A; --brand-800:#1C3227; --brand-700:#21392C;
  --brand:#294534; --brand-600:#3A5A47; --brand-500:#4A6B55;
  --brand-400:#6E8F78; --brand-300:#9AB5A2; --brand-200:#C3D3C8; --brand-100:#E3EBE5;
  /* —— 暖中性层（高级化的主来源：纸感底 + 暖灰文字） —— */
  --bg:#F7F5F0; --card:#FFFFFF; --card-2:#FBF9F5; --fill:#EDE9E0; --fill-2:#F1EEE7;
  --ink:#1A1A17; --ink-2:#6B6A63; --ink-3:#8A887F; --separator:rgba(60,56,50,.24);
  /* —— 金属点缀（面积 ≤2%：图标描边 / 徽章 / 图表高光） —— */
  --copper:#8A5A2B; --copper-200:#C9A46B;
  /* —— 状态语义：文字色与填充色分离，文字全部达 4.5:1 —— */
  --warning-text:#9A5A12; --warning:#D98A2B; --warn-bg:rgba(217,138,43,.13); --warn-line:rgba(217,138,43,.34);
  --danger-text:#B23A34; --danger:#C8503F;
  --info-text:#0057D9; --info:#007AFF;
  /* —— 数据身份色（仅用于图形，全部 ≥3:1） —— */
  --c-protein:#2C6E8F; --c-carb:#B07A2E; --c-fat:#7A5C8C; --c-cardio:#3E7D6A; --c-strength:#5B5F8A;
  /* —— 图表 —— */
  --chart-grid:rgba(60,56,50,.16); --chart-axis:#6B6A63;
  /* —— 角色映射与旧名保留（避免大范围改动） —— */
  --accent:#294534;            /* 填充：按钮底 / 进度 / 选中填充 */
  --accent-text:#294534;       /* 文字：链接 / 次级按钮 / 达标（10.5:1） */
  --accent-tint:#E3EBE5;       /* tint 底：数据卡 / 选中行 */
  --accent-line:rgba(41,69,52,.42);
  --sage:var(--accent); --sage-fill:var(--accent); --sage-bg:var(--accent-tint); --sage-l:var(--accent-line);
  --blue:var(--info-text); --blue-d:#0057D9;   /* 蓝色只剩「信息」一个角色 */
  --green:#2F6A3F; --orange:var(--warning); --red:var(--danger); --teal:#3E7D6A; --indigo:#5B5F8A; --pink:#B05A72;
  --label:var(--ink); --label-2:var(--ink-2); --sep:var(--separator);
  --ok:var(--brand-700); --warn:var(--warning-text); --disabled:var(--ink-3);
  --sub:var(--ink-2); --line:var(--separator); --track:var(--fill);
  --scrim:rgba(26,26,23,.42);
  --tabbar-bg:rgba(247,245,240,.92); --modal-bg:var(--card);
  --toast-bg:rgba(26,26,23,.90); --toast-ink:#F7F5F0;
  /* —— 圆角（5 档） —— */
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:28px; --r-pill:999px; --r:var(--r-md);
  /* —— 间距（4pt 栅格） —— */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
  /* —— 字号（8 档上限） —— */
  --fs-display:44px; --fs-large:34px; --fs-title:22px; --fs-headline:17px; --fs-body:17px;
  --fs-subhead:15px; --fs-footnote:13px; --fs-caption:12px; --fs-number:17px;
  /* —— 阴影（仅浮层；卡片永不用阴影） —— */
  --elev-1:0 2px 8px rgba(60,56,50,.10); --elev-2:0 12px 32px rgba(60,56,50,.16); --elev-3:0 24px 70px rgba(60,56,50,.24);
  --shadow:var(--elev-1);
  /* —— 动效：一套弹簧 + 一套缓出 + 三档时长 —— */
  --ease-spring:cubic-bezier(.32,.72,0,1);
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);
  --dur-fast:120ms; --dur-base:300ms; --dur-num:320ms;
  --dur-sheet:var(--dur-base); --dur-press:var(--dur-fast); --dur-ring:var(--dur-num);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}

/* 深色模式：做「墨」而不是「黑」，品牌绿提亮、状态色提亮，全部达 WCAG AA */
:root[data-theme="dark"]{
  --bg:#0E1210; --card:#171D1A; --card-2:#1F2724; --fill:#242C28; --fill-2:#1C2320;
  --ink:#F2F0EB; --ink-2:rgba(242,240,235,.62); --ink-3:rgba(242,240,235,.40); --separator:rgba(242,240,235,.14);
  --accent:#4A6B55; --accent-text:#9AB5A2; --accent-tint:rgba(154,181,162,.14); --accent-line:rgba(154,181,162,.42);
  --sage:var(--accent); --sage-fill:var(--accent); --sage-bg:var(--accent-tint); --sage-l:var(--accent-line);
  --blue:var(--accent-text);
  --ok:#8FC79E;
  --warning-text:#E0A458; --warning:#E0A458; --warn-bg:rgba(224,164,88,.18); --warn-line:rgba(224,164,88,.40);
  --danger-text:#F0857C; --danger:#C8503F;
  --info-text:#6FA8FF; --info:#0A84FF;
  --c-protein:#6FA8C9; --c-carb:#D8A65C; --c-fat:#A98BBB; --c-cardio:#6FB29A; --c-strength:#8A8FC4;
  --chart-grid:rgba(242,240,235,.14); --chart-axis:rgba(242,240,235,.60);
  --track:var(--fill); --disabled:rgba(242,240,235,.38);
  --scrim:rgba(0,0,0,.60);
  --tabbar-bg:rgba(14,18,16,.92); --modal-bg:var(--card);
  --toast-bg:rgba(242,240,235,.92); --toast-ink:#12211A;
  --copper:#C9A46B; --copper-200:#C9A46B;
  --elev-1:0 2px 8px rgba(0,0,0,.5); --elev-2:0 12px 32px rgba(0,0,0,.55); --elev-3:0 24px 70px rgba(0,0,0,.6);
  --shadow:var(--elev-1);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font); background:var(--bg); color:var(--ink);
  font-size:var(--fs-body); line-height:1.42; -webkit-font-smoothing:antialiased;
}
.num,input[type=number],.tabular{font-variant-numeric:tabular-nums;}
/* 焦点态：键盘 / iPad 外接键盘可见（原实现缺失） */
:focus{outline:none;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-xs);}
/* 字号阶梯（8 档，中文标题不再用 700） */
.f-display{font-size:var(--fs-display);font-weight:700;line-height:1.05;letter-spacing:-.5px;}
.f-large{font-size:var(--fs-large);font-weight:600;line-height:1.1;letter-spacing:-.5px;}
.f-title{font-size:var(--fs-title);font-weight:600;line-height:1.25;}
.f-number{font-size:var(--fs-number);font-weight:700;}
.f-body{font-size:var(--fs-body);font-weight:400;}
.f-cap{font-size:var(--fs-footnote);font-weight:400;color:var(--sub);line-height:1.6;}
.u-unit{font-size:var(--fs-subhead);font-weight:500;color:var(--sub);margin-left:2px;}
/* 数字滚动（文字局部过渡）：只换数字，不动未变文字 */
.roll{display:inline-block;overflow:hidden;vertical-align:bottom;line-height:1.1;}
.roll > i{display:block;font-style:normal;transition:transform var(--dur-num) var(--ease-out);}
/* 按压状态机：按下 120ms 内反馈；移出范围衰减；按钮外松手不触发 */
.pressable,.btn,.chip,.mini,.addbtn,.step-btn,.repbtn,.backlink,.tut-toggle,
.tabbar > button,.seg > button,.del,.dayrow,.item,.pickrow,.day-pick{
  touch-action:manipulation;
}
.pressed{transform:scale(.97) !important;filter:brightness(.94);}
.pressed.pressed-out{transform:scale(.995) !important;filter:brightness(.99);}
.btn,.chip,.mini,.addbtn,.step-btn,.repbtn,.backlink,.tut-toggle,.card,.item,.dayrow{
  transition:transform var(--dur-fast) var(--ease-out),filter var(--dur-fast) var(--ease-out),
             background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),
             border-color var(--dur-fast) var(--ease-out),opacity var(--dur-fast) var(--ease-out);
}
/* 小控件热区补足：视觉尺寸不变，命中区 ≥44 */
.chip,.mini,.day-pick{position:relative;}
.chip::after,.mini::after,.day-pick::after{content:"";position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%);}
.sheet-hd .x::after,.del::after,.repbtn::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%);}
/* 内联加载（按钮内 spinner，耗时操作 >300ms 时显示） */
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;
  display:inline-block;vertical-align:-2px;margin-right:6px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.btn.busy{pointer-events:none;opacity:.85;}
/* 空态模板：图形 + 说明 + 一个主 CTA */
.empty-st{text-align:center;padding:28px 12px 24px;}
.empty-st .es-ic{width:56px;height:56px;margin:0 auto 12px;border-radius:50%;background:var(--accent-tint);
  display:flex;align-items:center;justify-content:center;color:var(--accent-text);font-size:24px;line-height:1;}
.empty-st .es-t{font-size:var(--fs-subhead);font-weight:600;color:var(--ink);}
.empty-st .es-d{font-size:var(--fs-footnote);color:var(--sub);margin-top:6px;line-height:1.6;}
.empty-st .es-a{margin-top:14px;}

/* ============================================================
   2. 骨架
   ============================================================ */
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(74px + env(safe-area-inset-bottom));position:relative;}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:calc(6px + env(safe-area-inset-top)) 16px 6px;
  background:var(--tabbar-bg);
  -webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);
  border-bottom:1px solid transparent;transition:border-color var(--dur-press) ease;}
.topbar.scrolled{border-bottom-color:var(--line);}
.tb-main{min-width:0;}
.topbar h1{font-size:34px;font-weight:600;margin:0;letter-spacing:-.5px;line-height:1.1;
  transition:font-size var(--dur-press) var(--ease-soft);transform-origin:left center;}
.topbar.scrolled h1{font-size:17px;letter-spacing:0;}
.topbar .sub{font-size:var(--fs-caption);color:var(--sub);margin-top:3px;
  transition:opacity var(--dur-press) ease,max-height var(--dur-press) ease,margin var(--dur-press) ease;overflow:hidden;}
.topbar.scrolled .sub{opacity:0;max-height:0;margin-top:0;}
.theme-btn{flex:0 0 auto;width:44px;height:44px;margin-top:4px;border:0;background:transparent;color:var(--accent-text);
  border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  transition:opacity var(--dur-press) ease;-webkit-tap-highlight-color:transparent;}
.theme-btn:active{opacity:.5;}
.theme-btn svg{width:22px;height:22px;display:block;}
.view{display:none;padding:0 var(--sp-4) var(--sp-4);}
.view.active{display:block;animation:viewIn var(--dur-base) var(--ease-out);}
@keyframes viewIn{from{opacity:.4;transform:translateY(6px);}to{opacity:1;transform:none;}}
.card{background:var(--card);border:0;border-radius:var(--r-md);padding:var(--sp-4);margin-bottom:var(--sp-3);}
.card > h2{font-size:var(--fs-footnote);font-weight:600;color:var(--sub);margin:0 0 var(--sp-3);letter-spacing:0;text-transform:none;}
.row{display:flex;gap:var(--sp-3);align-items:center;}
.row-between{display:flex;gap:var(--sp-3);align-items:center;justify-content:space-between;}
.spacer{flex:1;}
.mt4{margin-top:4px;} .mt6{margin-top:8px;} .mt10{margin-top:12px;} .mt14{margin-top:16px;}
.mt20{margin-top:20px;} .mt24{margin-top:24px;}
.hr{height:1px;background:var(--line);margin:var(--sp-3) 0;border:0;}

/* ============================================================
   3. 表单控件（所有 input/select ≥16px，防 iOS 聚焦缩放）
   ============================================================ */
label.fld{display:block;font-size:var(--fs-footnote);color:var(--sub);margin:0 0 var(--sp-1) 2px;}
input[type=text],input[type=number],input[type=date],select,textarea{
  font-family:var(--font); font-size:var(--fs-body); color:var(--ink);
  background:var(--card); border:1px solid var(--separator); border-radius:var(--r-sm);
  padding:10px 12px; width:100%; min-height:44px; outline:none;
  font-variant-numeric:tabular-nums;
  transition:border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint);}
input[disabled],select[disabled]{background:var(--fill);color:var(--disabled);opacity:.6;}
input::placeholder{color:var(--ink-3);}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;}
.btn{
  font-family:var(--font); font-size:var(--fs-body); font-weight:600; min-height:50px; padding:0 var(--sp-4);
  border-radius:var(--r-pill); border:1px solid var(--accent); background:var(--accent); color:#fff;
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  -webkit-tap-highlight-color:transparent;
}
.btn.ghost{background:var(--accent-tint);color:var(--accent-text);border-color:transparent;}
.btn.subtle{background:var(--accent-tint);border-color:var(--accent-tint);color:var(--accent-text);}
.btn.danger{background:var(--card);border-color:var(--danger);color:var(--danger-text);}
.btn.block{display:flex;width:100%;}
.btn.sm{min-height:44px;font-size:var(--fs-subhead);padding:0 var(--sp-3);}
.btn[disabled]{background:var(--fill);border-color:var(--separator);color:var(--disabled);pointer-events:none;}
.seg{position:relative;display:flex;background:var(--fill);border-radius:var(--r-sm);padding:3px;gap:3px;}
.seg-thumb{position:absolute;top:3px;left:3px;height:calc(100% - 6px);background:var(--card);border-radius:var(--r-xs);box-shadow:var(--elev-1);z-index:0;opacity:0;pointer-events:none;transition:transform var(--dur-base) var(--ease-spring),width var(--dur-base) var(--ease-spring),opacity .2s ease;}
.seg > button{flex:1;min-height:44px;position:relative;z-index:1;border:0;background:transparent;border-radius:var(--r-xs);font-size:var(--fs-subhead);font-family:var(--font);color:var(--sub);cursor:pointer;font-weight:500;transition:color var(--dur-fast) var(--ease-out);-webkit-tap-highlight-color:transparent;}
.seg > button[aria-pressed=true]{color:var(--ink);font-weight:600;}
.chips{display:flex;gap:var(--sp-2);overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;}
.chip{flex:0 0 auto;min-height:34px;padding:0 14px;border-radius:var(--r-pill);border:0;background:var(--fill);color:var(--sub);font-size:var(--fs-subhead);font-family:var(--font);cursor:pointer;display:inline-flex;align-items:center;-webkit-tap-highlight-color:transparent;}
.chip[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:600;}
.mini{min-height:34px;padding:0 10px;border-radius:var(--r-xs);border:1px solid var(--separator);background:var(--card);font-size:var(--fs-footnote);font-family:var(--font);color:var(--sub);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
.mini.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.err{color:var(--warning-text);font-size:var(--fs-footnote);margin-top:5px;}
.ok{color:var(--ok);}
.warnc{color:var(--warning-text);}

/* ============================================================
   4. 今日页：环形 / 剩余额度 / 餐次
   ============================================================ */
.ring-wrap{display:flex;align-items:center;gap:var(--sp-4);}
.ring{width:126px;height:126px;flex:0 0 126px;position:relative;}
.ring svg{transform:rotate(-90deg);display:block;}
.ring-fg{transition:stroke-dashoffset var(--dur-num) var(--ease-out);}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring .ctr .v{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
.ring .ctr .l{font-size:12px;color:var(--sub);margin-top:inherit;margin-top:4px;}
.ring-info{flex:1;min-width:0;}
.kv{display:flex;gap:var(--sp-2);justify-content:space-between;font-size:var(--fs-footnote);color:var(--sub);}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700;}
.macros{display:flex;gap:var(--sp-2);margin-top:var(--sp-3);}
.macro{flex:1;background:var(--accent-tint);border-radius:var(--r-sm);padding:var(--sp-2) 6px;text-align:center;}
.macro .ml{font-size:12px;color:var(--sub);}
.macro .ml .dot{display:inline-block;width:7px;height:7px;border-radius:var(--r-pill);margin-right:5px;vertical-align:1px;}

/* ============================================================
   10. 分组标题 / 焦点区双主操作 / 详情层级（跟手返回载体）
   ============================================================ */
.grouphd{font-size:var(--fs-footnote);font-weight:600;color:var(--sub);padding:var(--sp-5) var(--sp-1) var(--sp-2);}
.grouphd:first-child{padding-top:var(--sp-1);}
.act-row{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-3);}
.act-row .btn{flex:1;min-width:0;}
.mealhd.tap{cursor:pointer;border-radius:var(--r-xs);}
.mealhd .chev{color:var(--disabled);font-size:15px;margin-left:4px;}

/* 详情层级：从右滑入；跟手返回拖动时由 JS 直接写 transform */
.detail{position:fixed;top:0;left:0;right:0;bottom:0;z-index:78;max-width:480px;margin:0 auto;
  background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(100%);visibility:hidden;box-shadow:-12px 0 32px rgba(26,26,23,.14);}
.detail.show{transform:translateX(0);visibility:visible;
  transition:transform var(--dur-base) var(--ease-spring), visibility 0s linear 0s;}

/* ---------------------- 小工具 ---------------------- */

/* Toast：可选操作按钮（撤销）。有操作时展示 4.2s，无操作 1.6s。 */
function toast(msg, actionLabel, actionFn){
  var t = $("toast"), m = $("toastMsg"), a = $("toastAct");
  if (m) m.textContent = msg; else t.textContent = msg;
  if (actionLabel && actionFn){
    if (a){ a.textContent = actionLabel; a.classList.remove("hidden"); }
    toast._fn = actionFn;
  } else {
    if (a) a.classList.add("hidden");

  }

/* ============================================================================
 * 文字局部过渡：只让「数字」从旧值滚到新值，同一行里未变的文字一律不动
 * 用法：模板里给数字元素加 data-numkey / data-numval，渲染后调用 tweenNums(root)
 * ======================================================================== */
var numCache = {};
function prefersReducedMotion(){
  try { return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
  catch (e) { return false; }
}
function tweenNums(root){
  var list = root.querySelectorAll("[data-numkey]");
  for (var i = 0; i < list.length; i++){
    (function(node){
      var key = node.getAttribute("data-numkey");
      var raw = node.getAttribute("data-numval");
      var to = parseFloat(raw);
      var from = numCache[key];
      numCache[key] = to;
      var dec = String(raw).indexOf(".") >= 0 ? 1 : 0;
      if (isNaN(to)) return;
      if (isNaN(from) || from == null || Math.abs(from - to) < 0.05 || prefersReducedMotion()){
        node.textContent = fmtNum(to, dec); return;
      }
      var t0 = null, dur = 320;
      node.textContent = fmtNum(from, dec);
      function step(ts){
        if (t0 == null) t0 = ts;
        var p = Math.min(1, (ts - t0) / dur);
        var e = 1 - Math.pow(1 - p, 3);
        node.textContent = fmtNum(from + (to - from) * e, dec);
        if (p < 1) requestAnimationFrame(step); else node.textContent = fmtNum(to, dec);
      }
      requestAnimationFrame(step);
    })(list[i]);
  }
}
function fmtNum(v, dec){ return dec ? (Math.round(v * 10) / 10).toFixed(1) : String(Math.round(v)); }
function numAttr(key, val){
  return ' data-numkey="' + key + '" data-numval="' + val + '"';
}

/* ============================================================================
 * 按压状态机（按钮滑出取消）：按下 ≤120ms 给反馈 → 移出范围按压感衰减 →
 * 按钮外松手不触发动作。iOS 按钮的标准行为，原实现只有 CSS :active，做不到。
 * ======================================================================== */
(function(){
  var held = null;
  var SEL = ".btn,.chip,.mini,.addbtn,.step-btn,.repbtn,.backlink,.tut-toggle,.tabbar > button,.seg > button,.del,.dayrow,.pickrow,.banner button";
  function near(node, x, y){
    var r = node.getBoundingClientRect();
    return x >= r.left - 8 && x <= r.right + 8 && y >= r.top - 8 && y <= r.bottom + 8;
  }
  function release(){
    if (!held) return;
    held.classList.remove("pressed"); held.classList.remove("pressed-out"); held = null;
  }
  document.addEventListener("pointerdown", function(e){
    if (e.button != null && e.button !== 0) return;
    var t = e.target && e.target.closest ? e.target.closest(SEL) : null;
    if (!t || t.disabled) return;
    held = t; t.classList.add("pressed"); t.classList.remove("pressed-out");
  }, true);
  document.addEventListener("pointermove", function(e){
    if (!held) return;
    if (near(held, e.clientX, e.clientY)) held.classList.remove("pressed-out");
    else held.classList.add("pressed-out");
  }, {passive:true});
  document.addEventListener("pointerup", release);
  document.addEventListener("pointercancel", release);
})();

/* ============================================================================
 * 详情层级 + 跟手返回（一次覆盖五类手势规范）
 *   方向锁定：起手 dead zone 8pt，|dx| > |dy| × 1.5 才锁横向，否则交还纵向滚动
 *   跟手位移：拖动期间由 rAF 直写 transform，不用 transition（可被随时接管）
 *   落点预览：距离 ≥32% 屏宽 或 速度 ≥0.5pt/ms 且位移 ≥60pt → 提前提示"松手返回"
 *   边界阻尼：向右越界（超出关闭位）走 rubber-band，越拉位移越小
 *   动画接管：拖动开始时移除 transition，从当前位置续接，绝不回跳
 * ======================================================================== */
var GD = { dead:8, ratio:1.5, edge:24, dist:0.32, vel:0.5, dampD:0.55, dampC:0.55 };
var detailSt = { open:false, armed:null, axis:null, dx:0, v:0, lastX:0, lastT:0 };

function detailRefs(){
  return { el:$("detail"), scrim:$("detailScrim"), hint:$("previewHint") };
}
function openDetail(title, html){
  var r = detailRefs(); if (!r.el) return;
  $("detailTitle").textContent = title;
  $("detailBody").innerHTML = html;
  detailSt.open = true;
  r.el.classList.add("show");
  r.scrim.classList.add("show");
  document.body.style.overflow = "hidden";
  document.body.classList.add("detail-open");
}
function closeDetail(){
  var r = detailRefs(); if (!r.el) return;
  detailSt.open = false;
  r.el.classList.remove("dragging", "show");
  r.el.style.transform = "";
  r.scrim.classList.remove("dragging", "show");
  r.scrim.style.opacity = "";
  r.hint.classList.remove("show");
  document.body.style.overflow = "";
  document.body.classList.remove("detail-open");
}
(function(){
  var drag = null;
  function W(){ var r = detailRefs(); return r.el ? r.el.getBoundingClientRect().width : 375; }
  function rubber(x){
    var max = W() * GD.dampD;
    return (1 - 1 / (Math.abs(x) * GD.dampC / max + 1)) * max * (x < 0 ? -1 : 1);
  }
  function willClose(moved, v){
    return Math.abs(moved) >= W() * GD.dist || (v <= -GD.vel && Math.abs(moved) >= 60);
  }
  document.addEventListener("pointerdown", function(e){
    if (!detailSt.open) return;
    var r = detailRefs(); if (!r.el) return;
    if (e.clientX - r.el.getBoundingClientRect().left > GD.edge) return;
    drag = { x0:e.clientX, y0:e.clientY };
    detailSt.armed = true; detailSt.axis = null; detailSt.dx = 0; detailSt.v = 0;
    detailSt.lastX = e.clientX; detailSt.lastT = performance.now();
  }, true);
  document.addEventListener("pointermove", function(e){
    if (!drag || !detailSt.open) return;
    var r = detailRefs(); if (!r.el) return;
    var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    var adx = Math.abs(dx), ady = Math.abs(dy);
    if (!detailSt.axis){
      if (adx < GD.dead && ady < GD.dead) return;
      if (adx > ady * GD.ratio) detailSt.axis = "x";
      else if (ady > adx * GD.ratio) { drag = null; detailSt.armed = null; return; }
      else return;
      r.el.classList.add("dragging"); r.scrim.classList.add("dragging");
    }
    if (detailSt.axis !== "x") return;
    var now = performance.now(), dt = Math.max(1, now - detailSt.lastT);
    detailSt.v = (e.clientX - detailSt.lastX) / dt;
    detailSt.lastX = e.clientX; detailSt.lastT = now;
    var move = dx > 0 ? rubber(dx) : dx;
    detailSt.dx = move;
    r.el.style.transform = "translateX(" + move.toFixed(1) + "px)";
    r.scrim.style.opacity = String(Math.max(0, Math.min(1, 1 - Math.abs(move) / W())));
    r.hint.classList.toggle("show", willClose(move, detailSt.v));
  }, {passive:true});
  function finish(){
    if (!drag || detailSt.axis !== "x" || !detailSt.open){ drag = null; return; }
    var r = detailRefs();
    var moved = detailSt.dx, v = detailSt.v;
    drag = null; detailSt.axis = null;
    r.el.classList.remove("dragging"); r.scrim.classList.remove("dragging");
    r.hint.classList.remove("show");
    if (willClose(moved, v)) { closeDetail(); return; }
    r.el.style.transition = "transform var(--dur-base) var(--ease-spring)";
    r.scrim.style.transition = "opacity var(--dur-base) ease";
    r.el.style.transform = "translateX(0)";
    r.scrim.style.opacity = "1";
    setTimeout(function(){
      var rr = detailRefs();
      if (rr.el){ rr.el.style.transition = ""; rr.el.style.transform = ""; }
      if (rr.scrim){ rr.scrim.style.transition = ""; rr.scrim.style.opacity = ""; }
      detailSt.dx = 0;
    }, 320);
  }
  document.addEventListener("pointerup", finish);
  document.addEventListener("pointercancel", function(){
    var r = detailRefs();
    drag = null; detailSt.axis = null;
    if (r.el){ r.el.classList.remove("dragging"); if (detailSt.open) r.el.style.transform = "translateX(0)"; }
    if (r.scrim) r.scrim.classList.remove("dragging");
    if (r.hint) r.hint.classList.remove("show");
  });
})();

/* 餐次详情页（详情层级的第一张内容页） */
function renderMealDetail(ds, k){
  var L = getDay(ds), c = compute();
  var items = (L.meals && L.meals[k]) || [];
  var mt = c ? c.mealTarget[k] : null, mm = c ? c.mealMacro[k] : null;
  var sum = { k:0, p:0, cc:0, f:0 };
  items.forEach(function(it){ sum.k += it.kcal; sum.p += it.p; sum.cc += it.c; sum.f += it.f; });
  var h = '<div class="card">'
    + '<div class="kv"><span>' + MEAL_NAME[k] + '目标</span><b>' + (mt == null ? "—" : mt + " kcal") + '</b></div>'
    + '<div class="kv mt6"><span>这一餐实际</span><b>' + Math.round(sum.k) + ' kcal</b></div>'
    + '<div class="macros mt10">'
    + macroCell("蛋白", r1(sum.p), mm ? mm.p : 0, "var(--c-protein)")
    + macroCell("碳水", r1(sum.cc), mm ? mm.c : 0, "var(--c-carb)")
    + macroCell("脂肪", r1(sum.f), mm ? mm.f : 0, "var(--c-fat)")
    + '</div></div>';
  if (items.length){
    h += '<div class="card"><h2>明细 · ' + items.length + ' 项</h2>';
    items.forEach(function(it, i){
      h += '<div class="item"><div class="in"><div class="nm">' + esc(it.name) + '</div>'
        + '<div class="ds">' + esc(amountText(it)) + ' · 蛋' + r1(it.p) + ' 碳' + r1(it.c) + ' 脂' + r1(it.f) + '</div></div>'
        + '<span class="kc">' + Math.round(it.kcal) + '</span>'
        + '<button type="button" class="del" data-act="delItem" data-d="' + ds + '" data-m="' + k + '" data-i="' + i + '" aria-label="删除">×</button></div>';
    });
    h += '</div>';
  } else {
    h += '<div class="card"><div class="empty-st">'
      + '<div class="es-ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></div>'
      + '<div class="es-t">这餐还是空的</div><div class="es-d">点下面的按钮记点什么</div></div></div>';
  }
  h += '<button type="button" class="btn block" data-act="add" data-d="' + ds + '" data-m="' + k + '">+ 添加食物</button>';
  return h;
}

/* ============================================================================
 * 一、数据层
 * ========================================================================== */
var DB = null;
var STORAGE_OK = true;

function defaultDB(){
  return {
    schemaVersion: SCHEMA,
    profile: { gender:"male", age:20, height:null, weight:null, activity:"light", deficit:500,
               goal:"fatloss", level:3, surplus:0,
               split:{ breakfast:30, lunch:40, dinner:30 } },
    foods: BUILTIN.map(function(f){ return Object.assign({}, f, {builtin:true}); }),
    overrides: {},
    logs: {},
    /* workouts/equipPref：训练模块 v3 预留（与搭配共用同一次版本升级，谁先落地谁补字段） */
    workouts: {},
    equipPref: { level:"fresh", goal:"fatloss", owned:{}, barWeight:20 },
    flags: { backupPrompted:false, disclaimerSeen:false, thinOverride:false, trainDisclaimerSeen:false }
  };
}

function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }

/* migrate：绝不靠改 key 名做版本；v1 三键合并 + 缺字段补齐 */
function migrate(){
  var raw = safeGet(KEY), d = null;
  if (raw) { try { d = JSON.parse(raw); } catch(e){ d = null; } }

  var fromV1 = false;
  if (!d || typeof d !== "object") {
    var p1 = safeGet("df_profile_v1");
    var f1 = safeGet("df_foods_v1");
    var c1 = safeGet("df_custom_v1");
    var l1 = safeGet("df_logs_v1");
    if (p1 || f1 || c1 || l1) {
      fromV1 = true;
      d = { schemaVersion:1, profile:null, foods:null, overrides:{}, logs:{}, flags:{} };
      try { if (p1) d.profile = JSON.parse(p1); } catch(e){}
      try { if (l1) d.logs = JSON.parse(l1) || {}; } catch(e){}
      var arr = [];
      try { if (f1) arr = arr.concat(JSON.parse(f1) || []); } catch(e){}
      try { if (c1) arr = arr.concat(JSON.parse(c1) || []); } catch(e){}
      d.foods = arr;
    }
  }

  if (!d || typeof d !== "object") { DB = defaultDB(); DB.flags.migratedFrom = fromV1; save(); return; }

  var base = defaultDB();

  /* 1) profile */
  var p = d.profile && typeof d.profile === "object" ? d.profile : {};
  base.profile = {
    gender: p.gender === "female" ? "female" : "male",
    age: num(p.age, 20) || 20,
    height: (p.height === "" || p.height == null || !isFinite(num(p.height, NaN))) ? null : num(p.height),
    weight: (p.weight === "" || p.weight == null || !isFinite(num(p.weight, NaN))) ? null : num(p.weight),
    activity: ACT[p.activity] ? p.activity : "light",
    deficit: isFinite(num(p.deficit, 500)) ? Math.max(0, num(p.deficit, 500)) : 500,
    goal: (p.goal === "maintain" || p.goal === "gain") ? p.goal : "fatloss",
    level: (p.level >= 1 && p.level <= 5) ? Math.round(num(p.level, 3)) : 3,
    surplus: isFinite(num(p.surplus, 0)) ? Math.max(0, num(p.surplus, 0)) : 0,
    split: { breakfast:30, lunch:40, dinner:30 }
  };
  if (p.split && typeof p.split === "object") {
    base.profile.split.breakfast = clamp(num(p.split.breakfast, 30), 0, 100);
    base.profile.split.lunch     = clamp(num(p.split.lunch, 40), 0, 100);
    base.profile.split.dinner    = clamp(num(p.split.dinner, 30), 0, 100);
  }

  /* 2) foods：内置恒在；v1 里被改过数值的内置食材 → 落成 overrides；其余作自定义 */
  var custom = [], seen = {}, ov = (d.overrides && typeof d.overrides === "object" && !Array.isArray(d.overrides)) ? d.overrides : {};
  var oldList = Array.isArray(d.foods) ? d.foods : [];
  var builtById = {}; BUILTIN.forEach(function(b){ builtById[b.id] = b; });
  var builtByName = {}; BUILTIN.forEach(function(b){ builtByName[b.name] = b; });
  oldList.forEach(function(f){
    if (!f || typeof f !== "object" || !f.name) return;
    var hit = builtById[f.id] || builtByName[f.name];
    if (hit) {
      var diff = {};
      ["kcal","p","c","f"].forEach(function(k){
        if (f[k] != null && isFinite(num(f[k], NaN)) && num(f[k]) !== hit[k]) diff[k] = num(f[k]);
      });
      if (Object.keys(diff).length) ov[hit.id] = Object.assign({}, ov[hit.id] || {}, diff);
      return;
    }
    if (seen[f.name]) return; seen[f.name] = 1;
    custom.push({
      id: f.id || uid(), name: String(f.name), cat: CATS.indexOf(f.cat) >= 0 ? f.cat : "蛋白",
      kcal: num(f.kcal, 0), p: num(f.p, 0), c: num(f.c, 0), f: num(f.f, 0),
      unit: UNITS.some(function(u){ return u.id === f.unit; }) ? f.unit : "g",
      per: num(f.per, 1) > 0 ? num(f.per, 1) : (f.unit && f.unit !== "g" && f.unit !== "ml" ? 100 : 1),
      unitLabel: f.unitLabel || UNIT_NAME[f.unit] || "克",
      builtin: false
    });
  });
  base.foods = BUILTIN.map(function(b){ return Object.assign({}, b, {builtin:true}); }).concat(custom);
  base.overrides = ov;

  /* 3) logs：meals 必须是对象且含 snack；item 补齐 unit/unitLabel/manual */
  var logs = (d.logs && typeof d.logs === "object" && !Array.isArray(d.logs)) ? d.logs : {};
  Object.keys(logs).forEach(function(k){
    var L = logs[k]; if (!L || typeof L !== "object") return;
    var meals = (L.meals && typeof L.meals === "object" && !Array.isArray(L.meals)) ? L.meals : {};
    var out = { breakfast:[], lunch:[], dinner:[], snack:[] };
    MEALS.forEach(function(m){
      var arr = Array.isArray(meals[m[0]]) ? meals[m[0]] : [];
      out[m[0]] = arr.map(function(it){ return normItem(it); }).filter(Boolean);
    });
    base.logs[k] = {
      weight: (L.weight == null || !isFinite(num(L.weight, NaN))) ? null : r1(num(L.weight)),
      meals: out
    };
  });

  /* 4) flags */
  var fl = (d.flags && typeof d.flags === "object") ? d.flags : {};
  base.flags = {
    backupPrompted: !!fl.backupPrompted,
    disclaimerSeen: !!fl.disclaimerSeen,
    thinOverride: !!fl.thinOverride,
    trainDisclaimerSeen: !!fl.trainDisclaimerSeen
  };
  base.schemaVersion = SCHEMA;
  base.flags.migratedFrom = fromV1 || (num(d.schemaVersion, 0) < SCHEMA);
  DB = base;
  save();
}

function normItem(it){
  if (!it || typeof it !== "object") return null;
  var o = {
    fid: it.fid || null,
    name: String(it.name || "未命名"),
    qty: num(it.qty, it.grams != null ? num(it.grams, 0) : 1),
    unit: UNITS.some(function(u){ return u.id === it.unit; }) ? it.unit : "g",
    unitLabel: it.unitLabel || UNIT_NAME[it.unit] || "克",
    grams: (it.grams == null || !isFinite(num(it.grams, NaN))) ? null : num(it.grams),
    kcal: num(it.kcal, 0), p: num(it.p, 0), c: num(it.c, 0), f: num(it.f, 0),
    manual: !!it.manual
  };
  if (o.manual) o.grams = null;
  return o;
}

/* save：try/catch + 持久横幅（非 alert） */
function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify(DB));
    if (!STORAGE_OK) { STORAGE_OK = true; hideBanner(); }
    return true;
  } catch(e){
    STORAGE_OK = false;
    showBanner("⚠ 数据未能保存到本机，请立即导出备份");
    return false;
  }
}
function showBanner(text){ $("bannerText").textContent = text; $("banner").classList.add("show"); }
function hideBanner(){ $("banner").classList.remove("show"); }

/* 唯一正确的取值方式：逐字段 merge，用 ?? 不用 || */
function eff(food){
  var o = DB.overrides[food.id] != null ? DB.overrides[food.id] : {};
  return Object.assign({}, food, o);
}
function findFood(id){ for (var i = 0; i < DB.foods.length; i++) if (DB.foods[i].id === id) return DB.foods[i]; return null; }
function unitLabelOf(f){ return f.unitLabel || UNIT_NAME[f.unit] || "克"; }
/* 单份的重量：论克取 100g 作为一份；其余取单位重量 */
function servingGrams(f){ return (f.unit === "g" || f.unit === "ml") ? 100 : (num(f.per, 0) > 0 ? num(f.per, 0) : 100); }

/* 只读：不落盘，渲染用；写操作一律走 ensureDay */
function getDay(ds){
  var L = DB.logs[ds];
  var out = { weight:null, meals:{} };
  MEALS.forEach(function(m){ out.meals[m[0]] = []; });
  if (!L || typeof L !== "object") return out;
  if (L.weight != null && isFinite(num(L.weight, NaN))) out.weight = r1(num(L.weight));
  var meals = (L.meals && typeof L.meals === "object" && !Array.isArray(L.meals)) ? L.meals : {};
  MEALS.forEach(function(m){ if (Array.isArray(meals[m[0]])) out.meals[m[0]] = meals[m[0]]; });
  return out;
}
/* 可写：返回真实引用，push 后需 save() */
function ensureDay(ds){
  if (!DB.logs[ds] || typeof DB.logs[ds] !== "object") DB.logs[ds] = { weight:null, meals:{} };
  var L = DB.logs[ds];
  if (!L.meals || typeof L.meals !== "object" || Array.isArray(L.meals)) L.meals = {};
  MEALS.forEach(function(m){ if (!Array.isArray(L.meals[m[0]])) L.meals[m[0]] = []; });
  if (L.weight != null && !isFinite(num(L.weight, NaN))) L.weight = null;
  return L;
}
function dayHasContent(ds){
  var L = DB.logs[ds]; if (!L || typeof L !== "object") return false;
  if (L.weight != null && isFinite(num(L.weight, NaN))) return true;
  var meals = L.meals || {};
  return MEALS.some(function(m){ return Array.isArray(meals[m[0]]) && meals[m[0]].length; });
}
function logDayCount(){ return Object.keys(DB.logs).filter(dayHasContent).length; }
function dayCalories(ds){
  var L = DB.logs[ds]; if (!L || !L.meals) return 0;
  var t = 0; MEALS.forEach(function(m){ (L.meals[m[0]] || []).forEach(function(it){ t += it.kcal; }); });
  return Math.round(t);
}
function dayMacros(ds){
  var L = DB.logs[ds], t = { kcal:0, p:0, c:0, f:0 };
  if (!L || !L.meals) return t;
  MEALS.forEach(function(m){ (L.meals[m[0]] || []).forEach(function(it){
    t.kcal += it.kcal; t.p += it.p; t.c += it.c; t.f += it.f; }); });
  t.kcal = Math.round(t.kcal); t.p = r1(t.p); t.c = r1(t.c); t.f = r1(t.f);
  return t;
}
function hasAnyLog(){ return Object.keys(DB.logs).some(dayHasContent); }
/* 条目数量文案：论克直接给克重，论个给「1 袋 · 110g」 */
function amountText(it){
  if (it.manual) return "手动估算";
  if (it.unit === "g" || it.unit === "ml") return Math.round(num(it.grams, 0)) + " g";
  return r1(it.qty) + " " + it.unitLabel + " · " + Math.round(num(it.grams, 0)) + "g";
}

/* ============================================================================
 * 二、算法（§2，照抄不发挥）
 * ========================================================================== */
function calcBMR(p){
  var b = 10 * p.weight + 6.25 * p.height - 5 * p.age;
  return p.gender === "male" ? b + 5 : b - 161;
}
function bmiLevel(b){
  if (b < 18.5) return { key:"thin",    label:"偏瘦" };
  if (b < 24)   return { key:"normal",  label:"正常" };
  if (b < 28)   return { key:"over",    label:"超重" };
  return { key:"obese", label:"肥胖" };
}
function compute(){
  var p = DB.profile;
  if (!(p.height > 0) || !(p.weight > 0)) return null;

  var bmrRaw  = calcBMR(p);
  var bmr     = Math.round(bmrRaw);
  var tdeeRaw = bmrRaw * (ACT[p.activity] || 1.2);
  var bmi     = p.weight / Math.pow(p.height / 100, 2);
  var lvl     = bmiLevel(bmi);
  var thinBlock = (lvl.key === "thin") && !DB.flags.thinOverride;

  /* 目标方向（档位）：增肌=盈余并入热量口径+高蛋白；维持=缺口0；减脂=用户缺口/档位模板。
     减脂与维持 surplus=0 → 行为与旧版完全一致（向后兼容）。盈余是"主动多吃"，非运动消耗补贴。 */
  var isGain = (p.goal === "gain") && !thinBlock;
  var surplus = isGain ? Math.max(0, num(p.surplus, 0)) : 0;
  var effTdeeRaw = tdeeRaw + surplus;
  var tdee    = Math.round(effTdeeRaw);

  var userDeficit = Math.max(0, num(p.deficit, 0));
  var want = thinBlock ? 0 : userDeficit;
  var cap1000 = 1000, cap25 = effTdeeRaw * 0.25;
  var deficit = Math.min(want, cap1000, cap25);

  var warns = [];
  if (thinBlock && userDeficit > 0) {
    warns.push({ type:"warn", text:"当前 BMI " + r1(bmi) + " 属偏瘦范围，建议维持而非继续减脂" });
  }
  var hitBmr = (effTdeeRaw - deficit) < bmrRaw;
  var base = Math.max(effTdeeRaw - deficit, bmrRaw);
  var targetCal = Math.round(base / 10) * 10;

  /* 钳位提示按触发原因三选一：触底 > 1000 上限 > 25% 闸（三个都真实生效，只是文案取最要紧的一条） */
  if (hitBmr) {
    warns.push({ type:"warn", text:"已触底：目标不低于基础代谢 " + bmr + " kcal。如需更大缺口，请先提高活动量" });
  } else if (want > cap1000 && cap1000 <= cap25) {
    warns.push({ type:"warn", text:"缺口已限制为 1000 kcal（单日安全上限）" });
  } else if (want > cap25) {
    warns.push({ type:"warn", text:"缺口已限制为 " + Math.round(cap25) + " kcal（不超过每日消耗的 25%）" });
  }

  /* 宏量：以未取整的 base 计算，保证与目标热量配平
     蛋白系数按档位：增肌 2.0 / 维持 1.4 / 减脂按强度 1.6–2.0；老数据无档位字段→1.8（零回归）。
     系数只是模板上限，仍受 35% 热量闸与 200g 硬上限夹，UI 永远展示实际值。 */
  var pf;
  if (isGain) pf = 2.0;
  else if (p.goal === "maintain") pf = 1.4;
  else if (p.goal === "fatloss" && p.level >= 1 && p.level <= 5) pf = PLAN_TPL.fatloss.protein[Math.round(p.level) - 1];
  else pf = 1.8;
  var protein = Math.min(pf * p.weight, base * 0.35 / 4, 200);
  protein = Math.round(protein);
  var fat = clamp(base * 0.25 / 9, 0.5 * p.weight, base * 0.35 / 9);
  fat = Math.round(fat);
  var carb = (base - 4 * protein - 9 * fat) / 4;
  var macroWarn = null;
  if (carb < 50) {
    fat = Math.max(0.5 * p.weight, (base - 4 * protein - 200) / 9);
    fat = Math.round(fat);
    carb = (base - 4 * protein - 9 * fat) / 4;
    if (carb < 50) {
      protein = Math.min(protein, Math.round(1.6 * p.weight));
      carb = (base - 4 * protein - 9 * fat) / 4;
      if (carb < 50) {
        carb = Math.max(0, carb);
        macroWarn = "⚠ 当前目标无法同时满足蛋白与脂肪下限，已优先保证蛋白。建议提高目标热量。";
      }
    }
  }
  carb = Math.round(carb);
  if (macroWarn) warns.push({ type:"warn", text:macroWarn });

  /* 三餐拆分：锁定晚餐 = 100 − 早 − 午；加餐不参与 */
  var sb = clamp(num(p.split.breakfast, 30), 0, 100);
  var sl = clamp(num(p.split.lunch, 40), 0, 100);
  var sd = 100 - sb - sl;
  var splitWarn = null;
  if (sb + sl >= 95) splitWarn = "早餐+午餐已占 " + Math.round(sb + sl) + "%，晚餐至少留 5%";

  return {
    bmr: bmr, tdee: tdee, bmi: r1(bmi), bmiLabel: lvl.label, thinBlock: thinBlock,
    goal: p.goal || "fatloss", level: p.level || 3, isGain: isGain, pFactor: pf,
    deficitWanted: userDeficit, deficit: Math.round(effTdeeRaw - base),
    targetCal: targetCal, protein: protein, fat: fat, carb: carb,
    split: { breakfast: sb, lunch: sl, dinner: sd }, splitWarn: splitWarn, warns: warns,
    mealTarget: {
      breakfast: Math.round(targetCal * sb / 100),
      lunch: Math.round(targetCal * sl / 100),
      dinner: Math.round(targetCal * Math.max(0, sd) / 100),
      snack: null
    },
    mealMacro: {
      breakfast: { p: Math.round(protein * sb / 100), c: Math.round(carb * sb / 100), f: Math.round(fat * sb / 100) },
      lunch:     { p: Math.round(protein * sl / 100), c: Math.round(carb * sl / 100), f: Math.round(fat * sl / 100) },
      dinner:    { p: Math.round(protein * Math.max(0, sd) / 100), c: Math.round(carb * Math.max(0, sd) / 100), f: Math.round(fat * Math.max(0, sd) / 100) }
    }
  };
}

function renderToday(){
  var v = $("view-today"), ds = state.date, c = compute(), L = getDay(ds);
  var eaten = dayMacros(ds), remain = c ? c.targetCal - eaten.kcal : null;
  var isToday = ds === todayKey();
  var h = "";

  /* 日期条 */
  h += '<div class="card" style="padding:10px 12px;">'
     + '<div class="row">'
     + '<button type="button" class="mini" data-act="shiftDay" data-n="-1">‹ 前一天</button>'

     + '<button type="button" class="mini" data-act="shiftDay" data-n="1"' + (isToday ? " disabled" : "") + '>后一天 ›</button>'
     + '</div>'
     + (isToday ? "" : '<button type="button" class="btn ghost block sm mt6" data-act="backToday">回到今天</button>')
     + '</div>';

  if (!c) {
    h += '<div class="card"><div class="empty-st">'
       + '<div class="es-ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg></div>'
       + '<div class="es-t">还没有目标</div>'
       + '<div class="es-d">填好身高体重，才能算出你每天该吃多少</div>'
       + '<div class="es-a"><button type="button" class="btn block" data-act="tab" data-tab="calc">去填写身高体重</button></div>'
       + '</div></div>';
  } else {
    var pct = c.targetCal > 0 ? eaten.kcal / c.targetCal * 100 : 0;
    var over = pct > 100, shown = Math.min(100, pct);
    var C = 2 * Math.PI * 55;
    var stroke = over ? "var(--warning)" : "var(--accent)";
    h += '<div class="card">'
       + '<div class="ring-wrap"><div class="ring">'
       + '<svg width="126" height="126" viewBox="0 0 126 126">'
       + '<circle cx="63" cy="63" r="55" stroke="var(--track)" stroke-width="12" fill="none"/>'
       + '<circle class="ring-fg" cx="63" cy="63" r="55" stroke="' + stroke + '" stroke-width="12" fill="none" stroke-linecap="round"'
       + ' stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '"'
       + ' data-to="' + (C * (1 - shown / 100)).toFixed(1) + '"/>'
       + '</svg>'
       + '<div class="ctr"><div class="v" style="color:' + stroke + '"><span' + numAttr("ring.pct", Math.round(pct)) + '>' + Math.round(pct) + '</span>%</div><div class="l">已吃 / 目标</div></div>'
       + '</div><div class="ring-info">'
       + '<div class="f-cap">' + (remain >= 0 ? "今日剩余" : "今日超出") + '</div>'
       + '<div class="f-display" style="color:' + (remain >= 0 ? "var(--ok)" : "var(--warning-text)") + '"><span' + numAttr("today.remain", Math.abs(remain)) + '>' + Math.abs(remain) + '</span> <small class="u-unit">kcal</small></div>'
       + '<div class="kv mt6"><span>已吃 / 目标</span><b><span' + numAttr("today.eaten", eaten.kcal) + '>' + eaten.kcal + '</span> / ' + c.targetCal + '</b></div>'
       + '<div class="kv mt4"><span>基础代谢 / 每日消耗</span><b>' + c.bmr + ' / ' + c.tdee + '</b></div>'
       + '</div></div>'
       + '<div class="macros">'
       + macroCell("蛋白", eaten.p, c.protein, "var(--c-protein)")
       + macroCell("碳水", eaten.c, c.carb, "var(--c-carb)")
       + macroCell("脂肪", eaten.f, c.fat, "var(--c-fat)")
       + '</div></div>';

    /* 焦点区下方：两个并列主操作，全在拇指可达区 */
    h += '<div class="act-row">'
       + '<button type="button" class="btn ghost" data-act="add" data-d="' + ds + '" data-m="' + defaultMealNow() + '">＋ 记一笔</button>'
       + '<button type="button" class="btn" data-act="openPlanner">⚡ 配三餐</button>'
       + '</div>'
       + '<div class="f-cap" style="text-align:center;margin:-4px 0 12px;">当前：' + (GOAL_LABEL[c.goal] || "减脂") + ' · 强度' + (c.level || 3)
       + '（每日 ' + c.targetCal + ' kcal · 蛋白 ' + c.protein + ' g）</div>';

    /* 人话换算（剩余额度已提到焦点区，这里只保留建议） */
    if (remain >= 0) {
      var sg = suggestCombos(remain);
      if (sg.length) {
        h += '<div class="card"><div class="suggest"><div class="t">接下来还能这么吃</div>';
        sg.forEach(function(s){ h += '<div class="li">≈ ' + esc(s.text) + '（约 ' + s.tot + ' kcal）</div>'; });
        h += '</div></div>';
      } else {
        h += '<div class="card"><div class="f-cap">剩下的额度不多了，喝口水吧。</div></div>';
      }
    } else {
      h += '<div class="card"><div class="f-cap">超了就翻篇，明天照常记。</div></div>';
    }

    c.warns.forEach(function(w){ h += '<div class="notice ' + w.type + '">' + esc(w.text) + '</div>'; });
    if (c.splitWarn) h += '<div class="notice warn">' + esc(c.splitWarn) + '</div>';
  }

  /* 四组餐次 */
  MEALS.forEach(function(m){
    var k = m[0], items = L.meals[k] || [], sum = { kcal:0, p:0, c:0, f:0 };
    items.forEach(function(it){ sum.kcal += it.kcal; sum.p += it.p; sum.c += it.c; sum.f += it.f; });
    sum.kcal = Math.round(sum.kcal);

       + '<div class="mealhd tap" data-act="openMeal" data-d="' + ds + '" data-m="' + k + '"><span class="nm">' + m[1] + '<span class="chev">›</span></span>'
       + '<span class="vv' + (isOver ? " over" : "") + '"><span' + numAttr("meal." + k, sum.kcal) + '>' + sum.kcal + '</span>'
       + (mt != null ? " / " + mt : "") + ' kcal</span></div>';
    if (items.length === 0) {

    } else {
      items.forEach(function(it, i){

           + '<button type="button" class="del" data-act="delItem" data-d="' + ds + '" data-m="' + k + '" data-i="' + i + '" aria-label="删除">×</button></div>';

    h += '<button type="button" class="addbtn" data-act="add" data-d="' + ds + '" data-m="' + k + '">+ 添加食物</button>'
       + '</div>';
  });

  /* 体重 */
  h += '<div class="card"><h2>今日体重</h2>'
     + '<div class="row">'
     + '<input type="number" inputmode="decimal" step="0.1" id="wInput" value="' + (L.weight == null ? "" : L.weight) + '" placeholder="如 68.5" style="flex:1;">'
     + '<button type="button" class="btn" data-act="saveWeight">记录</button></div>'
     + '<div class="f-cap mt6">建议晨起空腹、固定条件称；同一天重复填会覆盖。</div></div>';

  h += '<div class="footnote">本工具只记热量，饮水不参与计算<br>活动量已包含日常运动，运动后目标不上浮</div>';
  v.innerHTML = h;

  /* 文字局部过渡：只让数字滚到新值，同一行未变的文字（单位 / 目标）保持不动 */
  tweenNums(v);

  /* 详情页开着时同步刷新（例如在详情里加/删了食物） */
  if (detailSt.open && state.detailKey) {
    var dEl = $("detailBody");
    if (dEl) dEl.innerHTML = renderMealDetail(state.detailKey.d, state.detailKey.m);
  }

  /* 进度环补间：从空环过渡到目标值（尊重 prefers-reduced-motion，关闭时直接落位） */
  var ring = v.querySelector(".ring-fg");
  if (ring) requestAnimationFrame(function(){ ring.style.strokeDashoffset = ring.getAttribute("data-to"); });
  /* 宏量进度条从 0 补间到目标值 */
  v.querySelectorAll(".bar > i").forEach(function(b){
    var w = b.getAttribute("data-w");
    if (w != null) requestAnimationFrame(function(){ b.style.width = w + "%"; });
  });
}

function macroCell(label, val, tar, tone){
  var pp = tar > 0 ? Math.min(100, val / tar * 100) : 0;
  var over = val > tar;
  var col = over ? "var(--warning)" : (tone || "var(--accent)");
  return '<div class="macro"><div class="ml"><i class="dot" style="background:' + (tone || "var(--accent)") + '"></i>' + label + '</div>'
       + '<div class="mv"><span' + numAttr("macro." + label, r1(val)) + '>' + r1(val) + '</span>'
       + '<span class="u-unit" style="font-size:12px;">/' + tar + '</span></div>'
       + '<div class="bar"><i style="width:0;background:' + col + '" data-w="' + pp + '"></i></div></div>';
}

/* 人话换算：只用用户自己的食材库倒推组合 */
function suggestCombos(remain){
  if (!(remain >= 100)) return [];
  var cands = DB.foods.map(function(f){
    var e = eff(f), per = servingGrams(f);
    return { f:f, per:per, kcal: e.kcal * per / 100, label: unitLabelOf(f) };
  }).filter(function(x){ return x.kcal > 0; });

  var prim = cands.filter(function(x){ return x.f.cat === "蛋白" || x.f.cat === "主食"; });
  var sec  = cands.filter(function(x){ return x.f.cat === "蔬菜" || x.f.cat === "水果" || x.f.cat === "调味"; });
  if (!prim.length) prim = cands.slice(0, 6);
  function amt(c, q){ return (c.f.unit === "g" || c.f.unit === "ml") ? (c.per * q) + "g" : (q + " " + c.label); }
  var out = [];
  prim.forEach(function(a){
    for (var qa = 1; qa <= 4; qa++) {
      var ka = a.kcal * qa;
      if (ka > remain) break;
      if (ka >= remain * 0.6) out.push({ score: remain - ka, text: amt(a, qa) + " " + a.f.name, tot: Math.round(ka), key: a.f.id });
      sec.forEach(function(b){
        if (b.f.id === a.f.id) return;
        for (var qb = 1; qb <= 4; qb++) {
          var tot = ka + b.kcal * qb;
          if (tot > remain) break;
          if (tot < remain * 0.6) continue;
          out.push({ score: remain - tot, text: amt(a, qa) + " " + a.f.name + " + " + amt(b, qb) + " " + b.f.name, tot: Math.round(tot), key: a.f.id });
        }
      });
    }
  });
  out.sort(function(x, y){ return x.score - y.score; });
  var used = {}, pick = [];
  for (var i = 0; i < out.length && pick.length < 3; i++) {
    if (used[out[i].key]) continue;
    used[out[i].key] = 1; pick.push(out[i]);
  }
  return pick;
}

function ma7(pts){
  return pts.map(function(p){
    var lo = shiftDate(p.date, -6), s = 0, n = 0;
    pts.forEach(function(q){ if (q.date >= lo && q.date <= p.date) { s += q.w; n++; } });
    return { date:p.date, v: s / n };
  });
}

     + '<div class="cell"><div class="l">体重</div><div class="v">' + (p.weight == null ? "—" : p.weight) + ' <small style="font-size:11px;">kg</small></div></div>'
     + '</div>'
     + (c ? '<div class="f-cap mt10">BMI ' + c.bmi + ' · ' + c.bmiLabel + '</div>' : '<div class="f-cap mt10">还没填身体数据，算不出目标</div>')
     + '<button type="button" class="btn ghost block mt10" data-act="tab" data-tab="calc">修改身体数据</button></div>';

  /* 目标与档位：目标 × 强度档（1-5），改档即写库并联动计算 */
  if (c) {
    h += '<div class="card"><h2>目标与档位</h2>'
       + '<div class="kv"><span>每日目标</span><b>' + c.targetCal + ' kcal</b></div>'
       + '<div class="kv mt6"><span>蛋白目标</span><b>' + c.protein + ' g/天</b></div>'
       + '<div class="q-lbl" style="margin-top:14px;">目标</div>'
       + '<div class="seg">' + GOAL_ORDER.map(function(g){
            return '<button type="button" data-act="meGoal" data-v="' + g + '" aria-pressed="' + ((c.goal || "fatloss") === g) + '">' + GOAL_LABEL[g] + '</button>';
          }).join("") + '</div>'
       + '<div class="q-lbl" style="margin-top:14px;">训练强度（1–5）</div>'
       + '<div class="chips">' + [1,2,3,4,5].map(function(n){
            return '<button type="button" class="chip" data-act="meLevel" data-v="' + n + '" aria-pressed="' + ((c.level || 3) === n) + '">' + n + '</button>';
          }).join("") + '</div>'
       + '<div class="f-cap mt6">' + (LEVEL_HINTS[c.level || 3] || "")
       + (c.isGain ? ' · 增肌档每日主动盈余 +' + (p.surplus || 0) + ' kcal' : ' · 缺口/蛋白已按档位套用') + '</div>'
       + '<button type="button" class="btn block mt10" data-act="openPlanner">⚡ 按这套档位帮我配三餐</button></div>';
  } else {
    h += '<div class="card"><h2>目标与档位</h2><div class="empty">先填写身高体重，才能定档位</div>'
       + '<button type="button" class="btn block" data-act="tab" data-tab="calc">去填写</button></div>';
  }

  /* 数据管理 */
  h += '<div class="card"><h2>数据管理</h2><div class="row">'
     + '<button type="button" class="btn ghost" style="flex:1;" data-act="export">导出备份</button>'
     + '<button type="button" class="btn ghost" style="flex:1;" data-act="importPick">导入备份</button></div>'

     + '<div class="f-cap mt6">数据只存在本机浏览器，换设备前先导出备份。</div></div>';

  /* 体重趋势（归入「档案」组） */
  h += '<div class="grouphd">档案</div>';
  h += '<div class="card"><h2>体重趋势</h2>';
  if (avg7 != null) {
    h += '<div class="f-cap">近 7 日均值</div><div class="f-display">' + r1(avg7) + ' <small style="font-size:14px;font-weight:600;">kg</small></div>';

       + '<span><i style="background:var(--sage)"></i>7 日移动平均</span></div>';

  }
  h += '<div class="f-cap mt10">单日波动 ±1kg 多为水分，看 7 日均值。</div></div>';

  /* 历史（按月分组 + 懒加载）；点某天跳到今日页该日期补记 */
  var dates = Object.keys(DB.logs).filter(function(k){
    var L2 = DB.logs[k];
    return L2 && (L2.weight != null || MEALS.some(function(m){ return (L2.meals[m[0]] || []).length; }));
  }).sort().reverse();

  h += '<div class="card"><h2>历史记录</h2>'
     + '<div class="f-cap" style="margin:-4px 0 6px;">点任意一天回到当天补记，条目可删。</div>';
  if (!dates.length) {
    h += '<div class="empty">还没有历史记录</div>';
  } else {
    var groups = [], cur = null;
    dates.forEach(function(d){
      var ym = d.slice(0, 7);
      if (!cur || cur.ym !== ym) { cur = { ym:ym, list:[] }; groups.push(cur); }
      cur.list.push(d);
    });
    var show = Math.min(groups.length, state.logMonths);
    for (var i = 0; i < show; i++) {
      h += '<div class="monthhd">' + groups[i].ym.replace("-", " 年 ") + ' 月</div>';
      groups[i].list.forEach(function(d){
        var L2 = DB.logs[d], cal = dayCalories(d);
        h += '<div class="dayrow" data-act="openDay" data-v="' + d + '">'
           + '<span class="dl">' + fmtDate(d) + ' ' + weekdayOf(d) + '</span>'
           + '<span class="dr">' + (L2.weight != null ? r1(L2.weight) + " kg · " : "") + cal + " kcal ›</span></div>";
      });
    }
    if (show < groups.length) {
      h += '<button type="button" class="btn ghost block mt10" data-act="moreMonths">加载更早的记录（还有 ' + (groups.length - show) + ' 个月）</button>';
    }
  }
  h += '</div>';
  v.innerHTML = h;
  syncSeg();
}

function chartSVG(pts){
  var W = 320, H = 130, pl = 30, pr = 8, pt = 10, pb = 20;
  var ws = pts.map(function(p){ return p.w; }), mas = ma7(pts).map(function(p){ return p.v; });
  var lo = Math.min.apply(null, ws.concat(mas)), hi = Math.max.apply(null, ws.concat(mas));
  if (hi - lo < 1) { lo -= 0.5; hi += 0.5; }
  lo = Math.floor((lo - 0.2) * 2) / 2; hi = Math.ceil((hi + 0.2) * 2) / 2;
  var n = pts.length;
  function X(i){ return n === 1 ? (pl + (W - pl - pr) / 2) : pl + (W - pl - pr) * i / (n - 1); }
  function Y(v){ return pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo)); }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="体重趋势">';
  [0, 0.5, 1].forEach(function(t){
    var y = pt + (H - pt - pb) * t, val = hi - (hi - lo) * t;
    s += '<line x1="' + pl + '" y1="' + y.toFixed(1) + '" x2="' + (W - pr) + '" y2="' + y.toFixed(1) + '" stroke="var(--chart-grid)" stroke-width="1"/>';
    s += '<text x="2" y="' + (y + 3.5).toFixed(1) + '" font-size="9" fill="var(--chart-axis)">' + r1(val) + '</text>';
  });
  var rawPts = pts.map(function(p, i){ return X(i).toFixed(1) + "," + Y(p.w).toFixed(1); }).join(" ");
  var maPts  = mas.map(function(v, i){ return X(i).toFixed(1) + "," + Y(v).toFixed(1); }).join(" ");
  /* 数据色：原始记录=品牌绿浅阶，7 日均线=品牌绿主阶，最新点加实心锚点（不靠颜色单独表意） */
  s += '<polyline points="' + rawPts + '" fill="none" stroke="var(--brand-300)" stroke-width="1.6" stroke-linejoin="round"/>';
  s += '<polyline points="' + maPts + '" fill="none" stroke="var(--brand)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p, i){ s += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.w).toFixed(1) + '" r="1.6" fill="var(--brand-400)"/>'; });
  var li = n - 1;
  s += '<circle cx="' + X(li).toFixed(1) + '" cy="' + Y(pts[li].w).toFixed(1) + '" r="3.6" fill="var(--brand)"/>';
  s += '<text x="' + (X(li) - 6).toFixed(1) + '" y="' + (Y(pts[li].w) - 8).toFixed(1) + '" font-size="10" font-weight="600" fill="var(--ink)" text-anchor="end">最新 ' + pts[li].w + '</text>';
  s += '<text x="' + pl + '" y="' + (H - 6) + '" font-size="9" fill="var(--chart-axis)">' + fmtDate(pts[0].date) + '</text>';
  s += '<text x="' + (W - pr) + '" y="' + (H - 6) + '" font-size="9" fill="var(--chart-axis)" text-anchor="end">' + fmtDate(pts[n - 1].date) + '</text>';
  s += '</svg>';
  return s;
}

var WEEK_PLAN = [

function findAct(id){
  for (var i = 0; i < EQUIPMENT.length; i++){
    var as = EQUIPMENT[i].actions;
    for (var j = 0; j < as.length; j++) if (as[j].id === id) return { eq:EQUIPMENT[i], act:as[j] };
  }
  return null;
}
/* 某动作的卡内交互态：当前重量、每组次数、每组完成情况 */
function eqUI(act){
  var ui = state.trainUI[act.id];
  if (!ui) { ui = { w:act.rec, reps:[], done:[] }; state.trainUI[act.id] = ui; }
  while (ui.reps.length < act.sets){ ui.reps.push(act.lo); ui.done.push(false); }
  return ui;
}
/* 重量向下吸附到器材步进网格，宁轻勿重；step/loadType 在器材级 */
function eqSnap(eq, w){
  if (eq.loadType === "body") return 0;
  var s = eq.step || 2.5;
  return r1(Math.floor((num(w, 0) + 1e-9) / s) * s);
}
function eqTotals(){
  var sets = 0, ton = 0;
  EQUIPMENT.forEach(function(e){
    e.actions.forEach(function(a){
      var ui = state.trainUI[a.id]; if (!ui) return;
      for (var i = 0; i < ui.done.length; i++){
        if (!ui.done[i]) continue;
        sets++;
        if (e.loadType === "body") continue;
        var mult = e.loadType === "dumbbell" ? 2 : 1;   /* 哑铃按双只计容量 */
        ton += num(ui.w, a.rec) * num(ui.reps[i], a.lo) * mult;
      }
    });
  });
  return { sets:sets, ton:Math.round(ton) };
}

function renderTrain(){
  var v = $("view-train");
  restoreTrain();
  EQUIPMENT.forEach(function(e){ e.actions.forEach(function(a){ eqUI(a); }); });
  var t = eqTotals(), h = "";

  h += '<div class="hero"><div class="l">今日训练</div>'
     + '<div class="v">' + t.sets + ' <small>组</small></div>'
     + '<div class="l mt6">训练容量 ' + t.ton + ' kg · 哑铃按双只计 · 有氧按时长计</div></div>';

  h += weekPlanHTML();

  h += '<div class="card"><div class="chips">' + EQ_SCENES.map(function(s){
        return '<button type="button" class="chip" data-act="eqScene" data-v="' + s + '" aria-pressed="' + (state.trainScene === s) + '">' + s + '</button>';
      }).join("") + '</div>'
     + '<div class="chips mt10">' + EQ_MUSCLES.map(function(m){
        return '<button type="button" class="chip" data-act="eqMuscle" data-v="' + m + '" aria-pressed="' + (state.trainMuscle === m) + '">' + m + '</button>';
      }).join("") + '</div>'
     + '<div class="chips mt10">' + ["全部"].concat(LV_ORDER).map(function(lv){

/* 今日 draft ↔ 当日库恢复/落盘 */
function restoreTrain(){
  var d = todayKey();
  if (!DB.workouts || !DB.workouts[d] || !Array.isArray(DB.workouts[d])) return;
  DB.workouts[d].forEach(function(s){
    if (state.trainUI[s.actId]) return;
    var f = findAct(s.actId); if (!f) return;
    var ui = { w: s.sets.length ? num(s.sets[0].w, f.act.rec) : f.act.rec, reps: [], done: [] };
    s.sets.forEach(function(x){ ui.reps.push(num(x.r, f.act.lo)); ui.done.push(!!x.done); });
    while (ui.reps.length < f.act.sets){ ui.reps.push(f.act.lo); ui.done.push(false); }
    state.trainUI[s.actId] = ui;
  });
}
function persistTrain(eqId, actId){
  var ui = state.trainUI[actId]; if (!ui) return;
  var f = findAct(actId); if (!f) return;
  var d = todayKey();
  if (!DB.workouts[d] || !Array.isArray(DB.workouts[d])) DB.workouts[d] = [];
  var ses = null;
  DB.workouts[d].forEach(function(s){ if (s.actId === actId) ses = s; });
  if (!ses) { ses = { sid: uid(), eqId: eqId, actId: actId, loadType: f.eq.loadType, unit: f.eq.unit, sets: [], ts: Date.now() }; DB.workouts[d].push(ses); }
  ses.sets = [];
  for (var i = 0; i < ui.done.length; i++) ses.sets.push({ w: num(ui.w, 0), r: num(ui.reps[i], 0), done: !!ui.done[i] });
  save();
}

function eqCardHTML(e){

  var act = e.actions.filter(function(a){ return a.id === selId; })[0] || e.actions[0];
  var ui = eqUI(act);

       +  '<div class="f-number">' + esc(e.name) + '</div>'
       +  '<div><span class="tag b">' + lv.mark + lv.name + '</span>'
       +  e.muscles.map(function(m){ return '<span class="tag b">' + m + '</span>'; }).join("")
       +  '<span class="tag m">' + e.scene + '</span></div></div>';

  h += '<div class="eq-stage' + (act.animated && act.poses.b ? ' animated' : '') + '">' + eqStageSVG(act) + '</div>';
  /* 节奏条：与两态循环同步，示意「起—停—回」的力度曲线（替代逐关节高亮） */
  h += '<div class="eq-tempo"><span class="lb">节奏 ' + (act.animated && act.poses.b ? '2s 起 / 2s 回' : '匀速') + '</span>'

      return '<button type="button" class="chip" data-act="eqAct" data-eq="' + e.id + '" data-v="' + a.id + '" aria-pressed="' + (a.id === act.id) + '">' + lm + a.name + '</button>';
    }).join("") + '</div>';
  }

  if (e.loadType === "cardio"){
    h += '<div class="f-cap mt10" style="text-align:center;">有氧动作：目标 ' + act.lo + '–' + act.hi + ' 分钟，不上重量</div>';
  } else if (e.loadType === "body"){
    h += '<div class="f-cap mt10" style="text-align:center;">自重 / 弹力带动作，按组次完成即可</div>';
  } else {
    h += '<div class="f-cap mt10" style="text-align:center;">推荐起步 ' + act.rec + ' ' + e.unit + '（从轻开始，宁轻勿重）</div>'
       + '<div class="eq-load">'
       + '<button type="button" class="step-btn" data-act="eqW" data-v="' + act.id + '" data-d="-1" aria-label="减轻重量">−</button>'

       + '<button type="button" class="step-btn" data-act="eqW" data-v="' + act.id + '" data-d="1" aria-label="增加重量">＋</button></div>';
  }

  var repUnit = e.loadType === "cardio" ? " 分钟" : (act.durSec ? " 秒" : " 次");
  h += '<div class="f-cap" style="text-align:center;">目标 ' + act.sets + ' 组 × ' + act.lo + '–' + act.hi + repUnit + ' · 组间休 ' + act.rest + ' 秒</div>';

  for (var i = 0; i < ui.done.length; i++){
    var sx = e.loadType === "cardio" ? '<b class="num">' + r1(ui.reps[i]) + '</b> 分钟'
           : (e.loadType === "body" ? (act.durSec ? '<b class="num">' + ui.reps[i] + '</b> 秒' : "按节奏完成")
                                    : '<b class="num">' + r1(ui.w) + '</b> ' + e.unit);
    h += '<div class="set-row' + (ui.done[i] ? ' done' : '') + '">'
       + '<span class="sn">' + (ui.done[i] ? '✓ ' : '') + '第' + (i + 1) + '组</span>'
       + '<span class="sx">' + sx + '</span>'
       + '<button type="button" class="repbtn" data-act="eqRep" data-v="' + act.id + '" data-i="' + i + '" data-d="-1" aria-label="减少次数">−</button>'
       + '<span class="repnum num">' + ui.reps[i] + '</span>'
       + '<button type="button" class="repbtn" data-act="eqRep" data-v="' + act.id + '" data-i="' + i + '" data-d="1" aria-label="增加次数">＋</button>'
       + '<button type="button" class="mini' + (ui.done[i] ? ' on' : '') + '" data-act="eqSetDone" data-v="' + act.id + '" data-i="' + i + '">' + (ui.done[i] ? "重做" : "完成") + '</button>'
       + '</div>';

    h += '<div class="tut-body">'
      + '<h4>目标肌群</h4><div>' + esc(act.prime) + '</div>'
      + '<h4>起始姿势</h4><div>' + esc(act.prepare) + '</div>'
      + '<h4>动作步骤</h4><ul>' + act.steps.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join("") + '</ul>'
      + '<h4>呼吸</h4><div>' + esc(act.breath) + '</div>'
      + '<h4>常见错误</h4><ul>' + act.errors.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join("") + '</ul>'
      + '<h4>安全提示</h4><div>' + esc(act.safety) + '</div>'
      + '</div>';
  }
  h += '</div>';
  return h;
}

/* 训练页自有事件委托：只处理 #view-train 内部，其他点击落回原全局监听 */
document.addEventListener("click", function(ev){
  var tv = $("view-train");
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!tv || !el || !tv.contains(el)) return;
  var act = el.dataset.act, id = el.dataset.v;
  if (act === "eqScene"){ state.trainScene = id; renderTrain(); }
  else if (act === "eqMuscle"){ state.trainMuscle = id; renderTrain(); }
  else if (act === "eqLv"){ state.trainLv = id; renderTrain(); }
  else if (act === "trainWarm"){ state.trainWarm = !state.trainWarm; renderTrain(); }
  else if (act === "trainSafety"){ state.trainSafety = !state.trainSafety; renderTrain(); }
  else if (act === "trainRef"){ state.trainRef = !state.trainRef; renderTrain(); }
  else if (act === "planSel"){ state.planSel = num(id, WEEK_PLAN[0].dow); renderTrain(); }
  else if (act === "eqAct"){ state.trainSelAct[el.dataset.eq] = id; renderTrain(); }
  else if (act === "eqTut"){ state.trainTut[id] = !state.trainTut[id]; renderTrain(); }
  else if (act === "eqW"){
    var f0 = findAct(id); if (!f0) return;
    var ui0 = eqUI(f0.act);
    ui0.w = clamp(eqSnap(f0.eq, num(ui0.w, f0.act.rec) + num(el.dataset.d, 0) * f0.eq.step), 0, 200);
    persistTrain(f0.eq.id, id);
    renderTrain();
  }
  else if (act === "eqRep"){
    var f1 = findAct(id); if (!f1) return;
    var ui1 = eqUI(f1.act), idx1 = num(el.dataset.i, 0);
    ui1.reps[idx1] = clamp(num(ui1.reps[idx1], f1.act.lo) + num(el.dataset.d, 0), 1, 200);
    persistTrain(f1.eq.id, id);
    renderTrain();
  }
  else if (act === "eqSetDone"){
    var f2 = findAct(id); if (!f2) return;
    var ui2 = eqUI(f2.act), idx2 = num(el.dataset.i, 0);
    ui2.done[idx2] = !ui2.done[idx2];
    if (ui2.done.every(Boolean)) toast(f2.act.name + "完成");
    persistTrain(f2.eq.id, id);
    renderTrain();
  }
  else if (act === "eqAddSet"){
    var f3 = findAct(id); if (!f3) return;
    var ui3 = eqUI(f3.act);
    ui3.reps.push(f3.act.lo); ui3.done.push(false);
    persistTrain(f3.eq.id, id);
    renderTrain();
  }
});

       + '<div style="flex:1;"><label class="fld">单位重量 (g)</label><input type="number" inputmode="decimal" id="nfPer" value="100"></div></div>'

}

/* 本餐已加入的某食材累计数量（qty 累加：袋+袋=袋，g+g=g），给列表里打 ✓ 用 */
function addedInMeal(date, meal, fid){
  if (!date || !meal || !fid) return 0;
  var L = DB.logs[date]; if (!L || !L.meals) return 0;
  var arr = L.meals[meal] || [];
  var s = 0;
  arr.forEach(function(it){ if (it.fid === fid) s += num(it.qty, 0); });
  return s;
}

/* 按当前时间挑最可能的餐次：「＋ 记一笔」默认落到这一餐，省一次选择 */
function defaultMealNow(){
  var h = new Date().getHours();
  if (h < 5) return "snack";
  if (h < 10) return "breakfast";
  if (h < 15) return "lunch";
  if (h < 21) return "dinner";
  return "snack";
}
/* 最近 14 天出现次数最多的食材（添加食物页前置，减少翻列表） */
function frequentFoods(n){
  var counts = {}, lastSeen = {};
  Object.keys(DB.logs).sort().slice(-14).forEach(function(d){
    var L = DB.logs[d]; if (!L || !L.meals) return;
    MEALS.forEach(function(m){
      (L.meals[m[0]] || []).forEach(function(it){
        if (it.fid == null) return;
        counts[it.fid] = (counts[it.fid] || 0) + 1;
        lastSeen[it.fid] = d;
      });
    });
  });
  return Object.keys(counts).map(function(fid){
    return { f: findFood(fid), n: counts[fid], last: lastSeen[fid] };
  }).filter(function(x){ return !!x.f; })
    .sort(function(a, b){ return (b.n - a.n) || (b.last > a.last ? 1 : -1); })
    .slice(0, n || 6);
}

function pickerHTML(){

        + '<div class="chips" style="flex-wrap:wrap;overflow:visible;margin-bottom:12px;">'
        + freq.map(function(x){ return '<button type="button" class="chip" data-act="pick" data-id="' + x.f.id + '">' + esc(x.f.name) + '</button>'; }).join("")
        + '</div>';
    }
  }
  if (!list.length) {

      + '<div class="empty">没找到「' + esc(q || "该分类") + '」。可以手动估算，或新建为自定义食材</div>'
      + '<button type="button" class="btn block" data-act="newFormToggle">+ 新建食材并加入本餐</button>';
  }
  h += freqBlock;

    var added = Sd ? addedInMeal(Sd.date, Sd.meal, f.id) : 0;
    var addedLine = added > 0
      ? '<div class="f-cap" style="color:var(--ok);margin-top:2px;">✓ 本餐已加 ' + Math.round(added * 10) / 10 + ' ' + esc(unitLabelOf(f)) + '</div>'
      : '';
    h += '<div class="pickrow" data-act="pick" data-id="' + f.id + '" aria-pressed="' + (!!on) + '">'
       + '<div style="flex:1;min-width:0;"><div class="pn">' + esc(f.name) + '</div>'
       + '<div class="pd">每 100g ' + e.kcal + ' kcal · 蛋' + e.p + ' 碳' + e.c + ' 脂' + e.f + ' · ' + unitTxt + '</div>'
       + addedLine
       + '</div>'
       + '<span style="color:var(--accent-text);font-weight:700;">选</span></div>';
  });
  return h;

/* 生成条目快照 */
function makeItem(food, qty, unit, unitLabel){
  var e = eff(food);
  var per = (unit === "g" || unit === "ml") ? 1 : (num(food.per, 0) > 0 ? num(food.per, 0) : 100);
  var grams = qty * per;
  return {
    fid: food.id, name: food.name, qty: qty, unit: unit, unitLabel: unitLabel || unitLabelOf(food),
    grams: grams,
    kcal: Math.round(grams * e.kcal / 100),
    p: r1(grams * e.p / 100), c: r1(grams * e.c / 100), f: r1(grams * e.f / 100),
    manual: false
  };
}

/* 同食材(fid)同单位(unit) → 合并成一条：数量/克重/营养线性叠加（同单位下与克重严格成正比，直接相加即精确值） */
function mergeItemInto(arr, item){
  if (!item.fid) return false; /* 手动估算条目不入合并 */
  for (var i = 0; i < arr.length; i++){
    var t = arr[i];
    if (t.fid === item.fid && t.unit === item.unit) {
      t.qty = r1(num(t.qty, 0) + num(item.qty, 0));
      t.grams = r1(num(t.grams, 0) + num(item.grams, 0));
      t.kcal = Math.round(num(t.kcal, 0) + num(item.kcal, 0));
      t.p = r1(num(t.p, 0) + num(item.p, 0));
      t.c = r1(num(t.c, 0) + num(item.c, 0));
      t.f = r1(num(t.f, 0) + num(item.f, 0));
      return true;
    }
  }
  return false;
}
function pushItem(date, meal, item){
  var L = ensureDay(date);
  if (!mergeItemInto(L.meals[meal], item)) L.meals[meal].push(item);
  save();
}
function pushItems(date, meal, items){
  var L = ensureDay(date);
  items.forEach(function(it){ if (!mergeItemInto(L.meals[meal], it)) L.meals[meal].push(it); });
  save();
}
/* 历史数据去重：把已存的同日同餐重复行合并（幂等，每次加载跑一遍也无副作用） */
function mergeDupLogs(){
  Object.keys(DB.logs).forEach(function(d){
    var L = DB.logs[d]; if (!L || !L.meals) return;
    MEALS.forEach(function(m){
      var arr = L.meals[m[0]];
      if (!arr || arr.length < 2) return;
      var out = [];
      arr.forEach(function(it){ if (!mergeItemInto(out, it)) out.push(it); });
      L.meals[m[0]] = out;
    });
  });
}

/* ============================================================================
 * 十二、每餐智能搭配（档位 → 三餐菜单）
 * 角色纯度三约束（计划书 §3.2a）：
 *  ① 蛋白目标达成只统计"蛋白"角色（prot）的贡献——绝不用荞麦面这类碳水去补蛋白缺口；
 *  ② 最终核算 = 全部条目营养实际合计（碳水/蔬果自带的蛋白照常计入总蛋白并如实展示）；
 *  ③ 同类不堆叠：同餐同类 ≤2 种、同种食物不重复选两个不同份量；凑不出走差量诊断，不硬凑。
 * ========================================================================== */
function applyPlanGoal(goal, level){
  var p = DB.profile;
  p.goal = goal; p.level = level;
  if (goal === "maintain") { p.deficit = 0; p.surplus = 0; }
  else if (goal === "gain") { p.deficit = 0; p.surplus = PLAN_TPL.gain.surplus; }
  else { p.deficit = PLAN_TPL.fatloss.deficit[level - 1]; p.surplus = 0; }
  save();
}
function planSummary(g, lv){
  if (g === "gain")    return "增肌：每日盈余约 " + PLAN_TPL.gain.surplus + " kcal，蛋白按 2.0 g/kg（受安全闸限制，取实际值）";
  if (g === "maintain") return "维持：热量吃到消耗持平，蛋白按 1.4 g/kg";
  return "减脂·强度" + lv + "：缺口约 " + PLAN_TPL.fatloss.deficit[lv - 1] + " kcal/日，蛋白约 " + PLAN_TPL.fatloss.protein[lv - 1] + " g/kg";
}
function isMassUnit(f){ return f.unit === "g" || f.unit === "ml"; }
function qtyOptsOf(f){ return isMassUnit(f) ? [50, 100, 150, 200, 250, 300] : [1, 2, 3]; }

/* 每餐生成一组方案（opts ≤3，主蛋白/主食来源互不相同） */
function planOneMeal(target, pTarget){
  var pool = DB.foods.slice();
  var prots = [], carbs = [], fills = [];
  pool.forEach(function(f){
    var e = eff(f), r = roleOf(f);
    if (e.kcal <= 0) return;
    if (r === "prot") prots.push(f);
    else if (r === "carb") carbs.push(f);
    else fills.push(f);
  });
  var out = { target: target, pTarget: pTarget, opts: [], empty: false, msg: "" };
  if (!prots.length) { out.empty = true; out.msg = "蛋白类食材是空的——先加即食鸡胸、水煮蛋这类，才能配餐"; return out; }
  if (!carbs.length) { out.empty = true; out.msg = "主食类食材是空的——建议加荞麦面、即食玉米这类填碳水的"; return out; }

  function mk(f, q){ return makeItem(f, q, f.unit || "g", unitLabelOf(f)); }
  function run(padFrac, minPad){
    var pad = Math.max(Math.round(target * padFrac), minPad);
    var lo = target - pad, hi = target + pad;
    var best = [], seen = {};

    function add(items){
      var kcal = 0, pAll = 0, pProt = 0, keyP = null, keyC = null;
      items.forEach(function(it){
        kcal += it.kcal; pAll += it.p;
        var f = findFood(it.fid), r = f ? roleOf(f) : "fill";
        if (r === "prot") { pProt += it.p; if (keyP == null) keyP = it.fid; }
        else if (r === "carb" && keyC == null) keyC = it.fid;
      });
      kcal = Math.round(kcal); pAll = r1(pAll); pProt = r1(pProt);
      if (kcal > hi) return;
      var diff = kcal - target;
      var inBand = kcal >= lo && kcal <= hi;
      var score;
      if (inBand) score = Math.abs(diff);
      else if (kcal < lo) score = (lo - kcal) * 3 + 1;
      else score = (kcal - hi) * 3 + 2;
      if (pProt < pTarget * 0.85) score += 300;          /* 蛋白未达标：宁可判分差，也不加碳水硬凑（§3.2a-1） */
      if (keyP == null) score += 600;                     /* 缺蛋白主料 */
      if (keyC == null) score += 200;                     /* 缺碳水主料 → 结构不完整，垫底 */
      var key = (keyP || "p") + "|" + (keyC || "c");
      if (seen[key] !== undefined && seen[key] <= score) return;
      seen[key] = score;
      best.push({ items: items, kcal: kcal, pAll: pAll, pProt: pProt,
                  diff: diff, inBand: inBand, score: score, key: key });
    }

    /* 蛋白主：单种 1–3 份；双种（异种各 1–2 份）——同类不堆叠，种数≤2 */
    var protCombos = [];
    prots.forEach(function(f){
      qtyOptsOf(f).forEach(function(q){
        var it = mk(f, q);
        protCombos.push({ items: [it] });
      });
    });
    prots.forEach(function(f, i){
      prots.slice(i + 1).forEach(function(g){
        qtyOptsOf(f).forEach(function(qf){
          qtyOptsOf(g).forEach(function(qg){
            var itf = mk(f, qf), itg = mk(g, qg);
            if (itf.kcal + itg.kcal > hi + 150) return;
            protCombos.push({ items: [itf, itg] });
          });
        });
      });
    });

    /* 碳水主：单种一份或多份；双种（异种）——同一食物不重复两份量 */
    var carbCombos = [[]];
    carbs.forEach(function(f){
      qtyOptsOf(f).forEach(function(q){
        var it = mk(f, q);
        carbCombos.push([it]);
      });
    });
    carbs.forEach(function(f, i){
      carbs.slice(i + 1).forEach(function(g){
        var qs1 = isMassUnit(f) ? [50, 100, 150, 200] : [1, 2];
        var qs2 = isMassUnit(g) ? [50, 100, 150, 200] : [1, 2];
        qs1.forEach(function(q1){ qs2.forEach(function(q2){
          carbCombos.push([mk(f, q1), mk(g, q2)]);
        }); });
      });
    });

    protCombos.forEach(function(pc){
      carbCombos.forEach(function(cc){
        add(pc.items.concat(cc.items));
      });
    });

    /* 够接近还不够（kcal 低于下界）：补一样蔬果点缀（小份，单项） */
    var lowOnes = best.slice();
    lowOnes.sort(function(a, b){ return a.score - b.score; });
    lowOnes.slice(0, 25).forEach(function(b){
      if (b.kcal >= lo) return;
      fills.forEach(function(f){
        var used = {}; b.items.forEach(function(it){ used[it.fid] = 1; });
        if (used[f.id]) return;
        var qq = isMassUnit(f) ? [50, 100] : [1];
        qq.forEach(function(q){
          add(b.items.concat(mk(f, q)));
        });
      });
    });

    best.sort(function(a, b){ return a.score - b.score; });
    var hasBand = best.some(function(b){ return b.inBand; });
    var top = [], dup = {};
    best.forEach(function(b){
      if (top.length >= 6) return;
      if (dup[b.key]) return;
      dup[b.key] = 1; top.push(b);
    });
    return { top: top, hasBand: hasBand, lo: lo, hi: hi };
  }

  /* 先按 ±12%（≥50kcal）试；无达标方案再放宽 ±20%
     注意：局部结果命名 try1/try2，不得叫 r1——会遮蔽全局四舍五入助手 r1()，
     导致 add() 内 r1(pAll) 调到 undefined 直接 TypeError，弹窗链路静默炸掉 */
  var try1 = run(0.12, 50);
  if (!try1.hasBand) {
    var try2 = run(0.20, 80);
    if (try2.hasBand) { out.opts = try2.top.slice(0, 3); out.msg = "库内组合有限，已放宽到 ±20%，仍接近目标"; return out; }
    out.opts = try1.top.slice(0, 3);
    if (out.opts.length) {
      var bestOne = out.opts[0];
      if (bestOne.diff > 0) out.msg = "库内配出的最接近组合超出目标约 " + bestOne.diff + " kcal";
      else out.msg = "库内配出的最接近组合差 " + (-bestOne.diff) + " kcal 才到目标——去食材库补点主食/蛋白会更灵活";
    } else {
      out.empty = true;
      out.msg = "库内暂时配不出这一餐——去食材库加些常见主食/蛋白/蔬果再试";
    }
    return out;
  }
  out.opts = try1.top.slice(0, 3);
  return out;
}

function buildPlans(){
  var c = compute(); if (!c) return null;
  var plans = {};
  MEALS3.forEach(function(m){
    plans[m[0]] = planOneMeal(c.mealTarget[m[0]], c.mealMacro[m[0]].p);
  });
  return plans;
}

/* ============ planner bottom sheet ============ */
function openPlanner(btn){
  if (!compute()) { toast("先填好身高体重"); setTab("calc"); return; }
  var b = btn && btn.classList ? btn : null, sp = null;
  function build(){
    state.sheet = { type:"planner", date: state.date || todayKey(),
                    goal: DB.profile.goal || "fatloss", level: DB.profile.level || 3,
                    opt:{ breakfast:0, lunch:0, dinner:0 }, plans: buildPlans() };
    openSheet("按档位配三餐", plannerSheetHTML());
  }
  if (!b) { build(); return; }
  /* 组合枚举在大食材库下可能 >200ms：先绘制 spinner，再计算 */
  b.classList.add("busy");
  sp = document.createElement("span"); sp.className = "spinner"; b.insertBefore(sp, b.firstChild);
  setTimeout(function(){
    build();
    b.classList.remove("busy");
    if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
  }, 30);
}

function plannerPlansHTML(S){
  var h = "", c = compute();
  if (!S.plans || !c) { h += '<div class="notice info">选好档位后这里出三餐方案</div>'; return h; }
  MEALS3.forEach(function(m){
    var pm = S.plans[m[0]];
    if (!pm) return;
    var idx = Math.min(S.opt[m[0]] || 0, Math.max(0, pm.opts.length - 1));
    h += '<div class="card"><h2>' + m[1] + ' · 目标 ' + pm.target + ' kcal · 蛋白 ' + pm.pTarget + ' g</h2>';
    if (pm.empty || !pm.opts.length) {
      h += '<div class="empty">' + esc(pm.msg || "暂无可配方案") + '</div></div>';
      return;
    }
    h += '<div class="chips">'
       + pm.opts.map(function(o, i){
           return '<button type="button" class="chip" data-act="pOpt" data-m="' + m[0] + '" data-i="' + i + '" aria-pressed="' + (i === idx) + '">方案' + (i + 1) + '</button>';
         }).join("")
       + '</div>';
    var opt = pm.opts[idx];
    h += '<div class="row-between mt6"><span class="f-number">≈ ' + opt.kcal + ' kcal</span>'
       + '<span class="f-cap">' + (opt.diff >= 0 ? "超出 " + opt.diff : "差 " + (-opt.diff)) + ' · 蛋' + opt.pAll + '/' + pm.pTarget + 'g'
       + (opt.pProt >= pm.pTarget * 0.85 ? " <span style=\"color:var(--ok);\">✓</span>" : "") + '</span></div>';
    opt.items.forEach(function(it){
      h += '<div class="item"><div class="in"><div class="nm">' + esc(it.name) + '</div>'
         + '<div class="ds">' + esc(amountText(it)) + ' · 蛋' + r1(it.p) + ' 碳' + r1(it.c) + ' 脂' + r1(it.f) + '</div></div>'
         + '<span class="kc">' + Math.round(it.kcal) + '</span></div>';
    });
    h += '<button type="button" class="btn ghost block sm mt6" data-act="pUseMeal" data-m="' + m[0] + '">记入' + m[1] + '</button>'
       + '</div>';
  });
  h += '<button type="button" class="btn block" data-act="pUseAll">整套记入今日三餐</button>';
  return h;
}
